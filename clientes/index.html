<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A&H Wealth Group</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <style>
    body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#f4f6f9;
           color:#0A1628; display:flex; min-height:100vh; align-items:center;
           justify-content:center; text-align:center; padding:24px; }
    .spin { width:38px; height:38px; margin:0 auto 16px; border:4px solid #d8dee9;
            border-top-color:#D4AF37; border-radius:50%; animation:r .9s linear infinite; }
    @keyframes r { to { transform:rotate(360deg); } }
    a.btn { display:inline-block; margin-top:12px; padding:12px 22px; background:#0A1628;
            color:#F4ECD8; text-decoration:none; border-radius:8px; font-weight:600; }
    .aviso { display:none; max-width:440px; text-align:left; line-height:1.6;
             background:#fff; border:1px solid #e2e6ec; border-radius:10px; padding:20px 22px; }
  </style>
</head>
<body>
  <!--
    ALIAS DE COMPATIBILIDAD (2026-09-07). Ya NO es una pagina puente.
    Desde que proxy.php sirve la app dentro de este dominio, el expediente vive
    en /c/<token> y no hace falta ningun salto. Esto queda SOLO para que los
    enlaces ya repartidos (/clientes/?t=...) sigan funcionando: redirige al
    mismo dominio, sin salir a ninguna parte.
    SE PUEDE BORRAR cuando (a) Render tenga BASE_URL=https://ahwealthgroup.com y
    (b) no queden enlaces viejos en circulacion.
  -->
  <div>
    <div id="yendo">
      <div class="spin"></div>
      <p>Abriendo tu expediente…</p>
      <a id="go" class="btn" href="/prep">Continuar</a>
    </div>
    <div id="mal" class="aviso">
      <p><b>Te falta tu enlace personal.</b></p>
      <p>Esta página solo funciona con el enlace que te enviamos, porque ese enlace
         es lo que identifica tu expediente.</p>
      <p style="color:#5a6675;font-size:13px">Si no lo encuentras o no esperabas ningún enlace
         nuestro, <b>no subas ningún documento</b> y escríbenos antes.</p>
    </div>
  </div>
  <script>
    (function () {
      var t = new URLSearchParams(window.location.search).get('t') || '';
      if (!/^[A-Za-z0-9_-]{16,64}$/.test(t)) {
        document.getElementById('yendo').style.display = 'none';
        document.getElementById('mal').style.display = 'block';
        return;
      }
      var dest = '/c/' + encodeURIComponent(t);   // mismo dominio: ya no hay salto
      document.getElementById('go').href = dest;
      window.location.replace(dest);
    })();
  </script>
</body>
</html>
